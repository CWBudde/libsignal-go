# Pins the toolchain used to build the compat harness against upstream
# libsignal-protocol v0.102.2 (the version go-signal's libsignalgo expects).
# v0.102.2's own rust-toolchain moved from nightly-2026-03-23 to stable 1.98.1,
# and the harness must compile under the same toolchain as the upstream code it
# links. rustup fetches it on demand.

[toolchain]
channel = "1.98.1"
