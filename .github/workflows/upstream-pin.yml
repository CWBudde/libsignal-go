#
# Weekly pin monitor (cwbudde fork). The harness follows the libsignal tag that
# go-signal's libsignalgo expects, read from the purego branch of
# cwbudde/mautrix-signal (pkg/libsignalgo/signalversion), not upstream's latest
# release; compat-drift.yml still reports upstream main. When that tag moves,
# this workflow refreshes the harness tag/lock/vectors and opens an auto-merge PR. A green PR means the pure-Go port
# still agrees with upstream on the covered compatibility surface; a red PR is
# the work queue for required porting changes.

name: upstream-pin

on:
  schedule:
    # Mondays 08:00 UTC, after compat-drift has had a chance to report.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional signalapp/libsignal tag to pin, for example v0.102.2 (default: the tag libsignalgo expects)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat/rust-harness

      - name: require automation token
        env:
          GH_MANAGEMENT_TOKEN: ${{ secrets.GH_MANAGEMENT_TOKEN }}
        run: |
          if [ -z "${GH_MANAGEMENT_TOKEN:-}" ]; then
            echo "::error::GH_MANAGEMENT_TOKEN is required so the generated PR triggers required checks and can auto-merge"
            exit 1
          fi

      - name: resolve pin
        env:
          INPUT_TAG: ${{ inputs.upstream_tag }}
          SIGNALVERSION_URL: https://raw.githubusercontent.com/cwbudde/mautrix-signal/purego/pkg/libsignalgo/signalversion/version.go
        run: |
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(curl -fsSL "$SIGNALVERSION_URL" | sed -nE 's/^const Version = "([^"]+)"$/\1/p')"
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve the libsignal tag libsignalgo expects"
            exit 1
          fi
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"

      - name: update compat harness pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update-upstream-pin.sh "$UPSTREAM_TAG"

      - name: create compatibility PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_MANAGEMENT_TOKEN }}
          branch: automation/upstream-libsignal-pin
          delete-branch: true
          commit-message: "chore: re-pin compat harness to upstream libsignal"
          title: "chore: re-pin compat harness to the libsignal tag libsignalgo expects"
          body: |
            Automated upstream compatibility refresh.

            This PR was produced by `.github/workflows/upstream-pin.yml`.

            The updater:
            - refreshes `compat/rust-harness` to the `signalapp/libsignal` tag that cwbudde/mautrix-signal's libsignalgo expects
            - updates `compat/rust-harness/Cargo.lock`
            - regenerates all committed `compat/vectors/*.json`
            - runs vector consumption tests and live Rust-harness interop tests
            - runs proof report checks via `proofreport.Report()` so deferred and vector-backed coverage rows stay aligned with the upstream pin

            If CI stays green, the PR is safe to auto-merge. If CI fails, treat
            this PR as the manual porting queue for upstream compatibility drift.

      - name: request auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_MANAGEMENT_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
